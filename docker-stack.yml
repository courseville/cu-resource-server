# Production Docker Swarm stack for the MCV Resource Server.
#
# Images are built on a developer/CI machine, pushed to a private registry
# (e.g. ghcr.io), and pulled by the swarm at deploy time.
#
# First-time deploy:
#   1. On your local machine, log in to the registry and build + push images:
#        echo $GHCR_TOKEN | docker login ghcr.io -u <user> --password-stdin
#        export APP_IMAGE=ghcr.io/<owner>/mcv-app:<tag>
#        export WEB_IMAGE=ghcr.io/<owner>/mcv-web:<tag>
#        docker build -f Dockerfile             -t "$APP_IMAGE" .
#        docker build -f docker/Dockerfile.web  -t "$WEB_IMAGE" .
#        docker push "$APP_IMAGE"
#        docker push "$WEB_IMAGE"
#   2. On the swarm manager, init swarm if not already: `docker swarm init`
#   3. Log in to the registry on the manager so `--with-registry-auth` has
#      credentials to forward to worker nodes:
#        echo $GHCR_TOKEN | docker login ghcr.io -u <user> --password-stdin
#   4. Create swarm secrets (see SECRETS section below).
#   5. Copy `.env.production.example` → `.env.production`, edit values
#      (must include APP_IMAGE and WEB_IMAGE).
#   6. Deploy (load env so APP_IMAGE/WEB_IMAGE are interpolated):
#        set -a; . ./.env.production; set +a
#        docker stack deploy -c docker-stack.yml --with-registry-auth mcv
#
# Update an existing deploy (after pushing a new tag):
#   export APP_IMAGE=ghcr.io/<owner>/mcv-app:<new-tag>
#   export WEB_IMAGE=ghcr.io/<owner>/mcv-web:<new-tag>
#   docker stack deploy -c docker-stack.yml --with-registry-auth mcv
#
# SECRETS (run once before first deploy):
#   printf 'base64:...' | docker secret create mcv_app_key -
#   printf 'strong-db-password' | docker secret create mcv_db_password -
#   printf 'strong-redis-password' | docker secret create mcv_redis_password -
#   docker secret create mcv_oauth_private_key storage/oauth-private.key
#   docker secret create mcv_oauth_public_key  storage/oauth-public.key
#   printf 'passport-personal-access-secret' | docker secret create mcv_passport_pac_secret -
#
# Required env on the host shell (or via an env file sourced before deploy):
#   APP_IMAGE=ghcr.io/<owner>/mcv-app:<tag>
#   WEB_IMAGE=ghcr.io/<owner>/mcv-web:<tag>
#   APP_DOMAIN=api.example.com
#   APP_URL=https://api.example.com
#   ACME_EMAIL=ops@example.com
#   DB_DATABASE=resource_server
#   DB_USERNAME=mcv

version: '3.8'

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: 'false'
  APP_URL: ${APP_URL}
  APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
  LOG_CHANNEL: stack
  LOG_STACK: daily
  LOG_LEVEL: warning
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_CLIENT: phpredis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  PASSPORT_PERSONAL_ACCESS_CLIENT_ID: ${PASSPORT_PERSONAL_ACCESS_CLIENT_ID}

services:
  # ------------------------------------------------------------------
  # Edge: Traefik (TLS termination + Let's Encrypt via TLS-ALPN)
  # ------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    command:
      - --api.dashboard=false
      - --providers.swarm=true
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=mcv_public
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - traefik-letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - public
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s

  # ------------------------------------------------------------------
  # Web: nginx, public assets baked into the image, fastcgi → app
  # ------------------------------------------------------------------
  web:
    image: ${WEB_IMAGE}
    networks:
      - public
      - internal
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.docker.network=mcv_public
        - traefik.http.routers.mcv.rule=Host(`${APP_DOMAIN}`)
        - traefik.http.routers.mcv.entrypoints=websecure
        - traefik.http.routers.mcv.tls.certresolver=letsencrypt
        - traefik.http.services.mcv.loadbalancer.server.port=80

  # ------------------------------------------------------------------
  # App: php-fpm, the Laravel application
  # ------------------------------------------------------------------
  app:
    image: ${APP_IMAGE}
    environment:
      <<: *app-env
    secrets:
      - source: mcv_app_key
        target: app_key
      - source: mcv_db_password
        target: db_password
      - source: mcv_redis_password
        target: redis_password
      - source: mcv_oauth_private_key
        target: oauth_private_key
      - source: mcv_oauth_public_key
        target: oauth_public_key
      - source: mcv_passport_pac_secret
        target: passport_personal_access_client_secret
    volumes:
      - app-storage:/var/www/storage
    networks:
      - internal
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        delay: 15s
        order: start-first

  # ------------------------------------------------------------------
  # One-shot migration runner. Runs once per stack deploy; exits 0 on success.
  # ------------------------------------------------------------------
  migrate:
    image: ${APP_IMAGE}
    command: ["php", "artisan", "migrate", "--force"]
    environment:
      <<: *app-env
    secrets:
      - source: mcv_app_key
        target: app_key
      - source: mcv_db_password
        target: db_password
      - source: mcv_redis_password
        target: redis_password
    volumes:
      - app-storage:/var/www/storage
    networks:
      - internal
    depends_on:
      - postgres
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: none

  # ------------------------------------------------------------------
  # Queue worker
  # ------------------------------------------------------------------
  worker:
    image: ${APP_IMAGE}
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600", "--sleep=3"]
    environment:
      <<: *app-env
    secrets:
      - source: mcv_app_key
        target: app_key
      - source: mcv_db_password
        target: db_password
      - source: mcv_redis_password
        target: redis_password
    volumes:
      - app-storage:/var/www/storage
    networks:
      - internal
    depends_on:
      - app
      - redis
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s

  # ------------------------------------------------------------------
  # Scheduler (single replica — must not run more than once)
  # ------------------------------------------------------------------
  scheduler:
    image: ${APP_IMAGE}
    command: ["/bin/sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    environment:
      <<: *app-env
    secrets:
      - source: mcv_app_key
        target: app_key
      - source: mcv_db_password
        target: db_password
      - source: mcv_redis_password
        target: redis_password
    volumes:
      - app-storage:/var/www/storage
    networks:
      - internal
    depends_on:
      - app
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s

  # ------------------------------------------------------------------
  # PostgreSQL
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: mcv_db_password
        target: db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s

  # ------------------------------------------------------------------
  # Redis (cache, sessions, queue) — password-protected
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --requirepass \"$$(cat /run/secrets/redis_password)\" --appendonly yes"]
    secrets:
      - source: mcv_redis_password
        target: redis_password
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s

# ----------------------------------------------------------------------
# Networks
#   - public:   shared with traefik; reachable from outside
#   - internal: backend services only; no host exposure
# ----------------------------------------------------------------------
networks:
  public:
    name: mcv_public
    driver: overlay
  internal:
    name: mcv_internal
    driver: overlay
    internal: true

# ----------------------------------------------------------------------
# Volumes (named, driver=local — bound to the manager node)
# ----------------------------------------------------------------------
volumes:
  postgres-data:
  redis-data:
  app-storage:
  traefik-letsencrypt:

# ----------------------------------------------------------------------
# External secrets — must be created via `docker secret create` first.
# Names must match exactly. See the SECRETS block at the top of this file.
# ----------------------------------------------------------------------
secrets:
  mcv_app_key:
    external: true
  mcv_db_password:
    external: true
  mcv_redis_password:
    external: true
  mcv_oauth_private_key:
    external: true
  mcv_oauth_public_key:
    external: true
  mcv_passport_pac_secret:
    external: true
